name: sekretariat

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sekretariat-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sekretariat-net

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sekretariat-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -v > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sekretariat-net

  postgres:
    image: postgres:16-alpine
    container_name: sekretariat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sekretariat-net

  redis:
    image: redis:7-alpine
    container_name: sekretariat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - sekretariat-net

networks:
  sekretariat-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data: